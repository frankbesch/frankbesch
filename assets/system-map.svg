<text x="28" y="261" font-size="14" fill="#22232E" font-weight="600">paper-forge-engine</text>
<text x="28" y="279" font-size="13" fill="#5C5F78">research library, offline console</text>
<rect x="16" y="302" width="4" height="11" fill="#1E5468"/>
<text x="28" y="312" font-size="13" fill="#22232E" letter-spacing="1.5">GPU INFERENCE</text>
