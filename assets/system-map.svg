<rect x="16" y="692" width="4" height="11" fill="#8D3731"/>
<text x="28" y="702" font-size="13" fill="#22232E" letter-spacing="1.5">DEMO KITS</text>
<rect x="16" y="714" width="328" height="40" rx="4" fill="#E4E5F3" stroke="#5C5F78"/>
<text x="28" y="729" font-size="14" fill="#22232E" font-weight="600">jib-ai-wingmate</text>
<text x="28" y="747" font-size="13" fill="#5C5F78">permit packets to cited fields</text>
