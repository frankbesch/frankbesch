<svg viewBox="0 0 360 770" xmlns="http://www.w3.org/2000/svg" role="img" font-family='"QuoinMono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>System map</title>
<desc>System map in five groups. Agents and evals: memvet (installed by homebrew-tap), septdrift, paper-forge-engine; gpu inference: nim-gke, nimble-oke; apps and decisions: venture-signal, fibonacci-calculator; research: research-one-loop-two-ledgers, research-hermes-nemoclaw-sandbox; demo kits: jib-ai-wingmate. nim-gke and nimble-oke are the same NVIDIA NIM kit on two clouds.</desc>
<style>@font-face{font-family:"QuoinMono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinMono";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="360" height="770" rx="6" fill="#FBFBFE"/>
<text x="16" y="36" font-size="26" fill="#5C5F78">02</text>
<text x="58" y="32" font-size="13" fill="#22232E" letter-spacing="1.5">SYSTEM MAP</text>
<text x="344" y="32" font-size="13" fill="#5C5F78" text-anchor="end">~/02-system-map</text>
