<text x="28" y="105" font-size="14" fill="#22232E" font-weight="600">memvet</text>
<text x="28" y="123" font-size="13" fill="#5C5F78">integrity checks for agent memory</text>
<line x1="36" y1="130" x2="36" y2="154" stroke="#5C5F78" stroke-dasharray="3 4"/>
<text x="48" y="146" font-size="13" fill="#5C5F78">installed by</text>
<rect x="16" y="154" width="328" height="40" rx="4" fill="#E4E5F3" stroke="#5C5F78"/>
<text x="28" y="169" font-size="14" fill="#22232E" font-weight="600">homebrew-tap</text>
<text x="28" y="187" font-size="13" fill="#5C5F78">brew install frankbesch/tap/memvet</text>
<rect x="16" y="200" width="328" height="40" rx="4" fill="#E4E5F3" stroke="#5C5F78"/>
<text x="28" y="215" font-size="14" fill="#22232E" font-weight="600">septdrift</text>
<text x="28" y="233" font-size="13" fill="#5C5F78">model drift across macOS updates</text>
