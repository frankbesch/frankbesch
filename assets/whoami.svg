<svg viewBox="0 0 360 412" xmlns="http://www.w3.org/2000/svg" role="img" font-family='"QuoinMono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>Who I am</title>
<desc>Who I am: I lead, I sell, and I build. Recent hands-on work includes multi-agent AI systems with persistent memory, LLM evaluation and drift-testing harnesses, and governed demo pipelines, written in Go, Python, and Swift, plus NVIDIA NIM deployed on Kubernetes. In a pursuit, that lets me shape the solution with the delivery team and pressure-test it before an operator&#x27;s CIO does. I decide where model judgment ends and deterministic code takes over, then back it with paired evals and a cost model before the client commits.</desc>
