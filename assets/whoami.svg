<svg viewBox="0 0 360 540" xmlns="http://www.w3.org/2000/svg" role="img" font-family='"QuoinMono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>Who I am</title>
<desc>Who I am: Customers should see evidence before they commit. I lead teams and build the tools that produce it. For an oil-and-gas billing workflow, I built a document pipeline on Pulse&#x27;s parser and Claude, then tested a discriminative model on specific decisions. In a small synthetic pilot, clearer definitions improved its results. Another instruction fixed its target but broke answers elsewhere; only testing the full set showed the tradeoff. I define value with the customer first, test model judgment against known answers, and keep deterministic checks in code. Exceptions go to a person, with the evidence attached. The customer sees what works, what fails, and what still needs proving.</desc>
<style>@font-face{font-family:"QuoinMono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="360" height="540" rx="6" fill="#FBFBFE"/>
<text x="16" y="36" font-size="26" fill="#5C5F78">01</text>
<text x="58" y="32" font-size="13" fill="#22232E" letter-spacing="1.5">WHOAMI</text>
<text x="344" y="32" font-size="13" fill="#5C5F78" text-anchor="end">~/01-whoami</text>
<line x1="16" y1="50" x2="344" y2="50" stroke="#D0D2E6"/>
