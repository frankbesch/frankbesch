<text x="16" y="168" font-size="15" fill="#22232E">I built a document pipeline on</text>
<text x="16" y="188" font-size="15" fill="#22232E">Pulse&#x27;s parser and Claude, then</text>
<text x="16" y="208" font-size="15" fill="#22232E">tested a discriminative model on</text>
<text x="16" y="228" font-size="15" fill="#22232E">specific decisions. In a small</text>
<text x="16" y="248" font-size="15" fill="#22232E">synthetic pilot, clearer definitions</text>
<text x="16" y="268" font-size="15" fill="#22232E">improved its results. Another</text>
<text x="16" y="288" font-size="15" fill="#22232E">instruction fixed its target but</text>
<text x="16" y="308" font-size="15" fill="#22232E">broke answers elsewhere; only</text>
<text x="16" y="328" font-size="15" fill="#22232E">testing the full set showed the</text>
<text x="16" y="348" font-size="15" fill="#22232E">tradeoff.</text>
<text x="16" y="378" font-size="15" fill="#22232E">I define value with the customer</text>
<text x="16" y="398" font-size="15" fill="#22232E">first, test model judgment against</text>
<text x="16" y="418" font-size="15" fill="#22232E">known answers, and keep</text>
