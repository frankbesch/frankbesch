<svg viewBox="0 0 360 928" xmlns="http://www.w3.org/2000/svg" role="img" font-family='"QuoinMono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>Agents and evals and Gpu inference</title>
<desc>Agents and evals: memvet, septdrift, and paper-forge-engine. Links and receipts follow in text. Gpu inference: nim-gke and nimble-oke. Links and receipts follow in text.</desc>
<style>@font-face{font-family:"QuoinMono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinMono";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="360" height="928" rx="6" fill="#FBFBFE"/>
<g transform="translate(0,0)"><text x="16" y="36" font-size="26" fill="#5C5F78">03</text>
<text x="58" y="32" font-size="13" fill="#22232E" letter-spacing="1.5">AGENTS AND EVALS</text>
<text x="344" y="32" font-size="13" fill="#5C5F78" text-anchor="end">~/03-agents</text>
<line x1="16" y1="50" x2="344" y2="50" stroke="#D0D2E6"/>
<rect x="16" y="78" width="328" height="135" rx="4" fill="#E4E5F3" stroke="#5C5F78"/>
<rect x="16" y="78" width="4" height="135" fill="#8A681E"/>
<text x="32" y="102" font-size="14" fill="#22232E" font-weight="600">memvet</text>
<text x="332" y="102" font-size="13" fill="#5C5F78" letter-spacing="1.5" text-anchor="end">GO</text>
<text x="32" y="126" font-size="13" fill="#5C5F78">go vet for file-based AI agent state:</text>
<text x="32" y="143" font-size="13" fill="#5C5F78">integrity checks for memory,</text>
<text x="32" y="160" font-size="13" fill="#5C5F78">instructions, decisions, and</text>
<text x="32" y="177" font-size="13" fill="#5C5F78">contracts.</text>
<text x="32" y="194" font-size="13" fill="#22232E" font-weight="600">v0.12.0 · read-only check · MIT</text>
<rect x="16" y="225" width="328" height="152" rx="4" fill="#E4E5F3" stroke="#5C5F78"/>
<rect x="16" y="225" width="4" height="152" fill="#8A681E"/>
<text x="32" y="249" font-size="14" fill="#22232E" font-weight="600">septdrift</text>
<text x="332" y="249" font-size="13" fill="#5C5F78" letter-spacing="1.5" text-anchor="end">SWIFT</text>
<text x="32" y="273" font-size="13" fill="#5C5F78">Catches drift in Apple Foundation</text>
<text x="32" y="290" font-size="13" fill="#5C5F78">Models behavior across macOS updates,</text>
<text x="32" y="307" font-size="13" fill="#5C5F78">scored check by check from</text>
<text x="32" y="324" font-size="13" fill="#5C5F78">hash-chained recordings.</text>
<text x="32" y="341" font-size="13" fill="#22232E" font-weight="600">v0.1.0 · 136 tests · measured once on</text>
<text x="32" y="358" font-size="13" fill="#22232E" font-weight="600">two Macs</text>
<rect x="16" y="389" width="328" height="135" rx="4" fill="#E4E5F3" stroke="#5C5F78"/>
<rect x="16" y="389" width="4" height="135" fill="#8A681E"/>
<text x="32" y="413" font-size="14" fill="#22232E" font-weight="600">paper-forge-engine</text>
<text x="332" y="413" font-size="13" fill="#5C5F78" letter-spacing="1.5" text-anchor="end">PYTHON</text>
<text x="32" y="437" font-size="13" fill="#5C5F78">Local research library: capture with</text>
<text x="32" y="454" font-size="13" fill="#5C5F78">checksums, seven-stage workbooks,</text>
<text x="32" y="471" font-size="13" fill="#5C5F78">assessments, and an offline console.</text>
<text x="32" y="488" font-size="13" fill="#22232E" font-weight="600">standard library only ·</text>
<text x="32" y="505" font-size="13" fill="#22232E" font-weight="600">byte-identical output</text></g>
<g transform="translate(0,552)"><text x="16" y="36" font-size="26" fill="#5C5F78">04</text>
<text x="58" y="32" font-size="13" fill="#22232E" letter-spacing="1.5">GPU INFERENCE</text>
<text x="344" y="32" font-size="13" fill="#5C5F78" text-anchor="end">~/04-gpu-inference</text>
<line x1="16" y1="50" x2="344" y2="50" stroke="#D0D2E6"/>
<rect x="16" y="78" width="328" height="135" rx="4" fill="#E4E5F3" stroke="#5C5F78"/>
<rect x="16" y="78" width="4" height="135" fill="#1E5468"/>
<text x="32" y="102" font-size="14" fill="#22232E" font-weight="600">nim-gke</text>
<text x="332" y="102" font-size="13" fill="#5C5F78" letter-spacing="1.5" text-anchor="end">SHELL</text>
<text x="32" y="126" font-size="13" fill="#5C5F78">NVIDIA NIM on Google Kubernetes</text>
<text x="32" y="143" font-size="13" fill="#5C5F78">Engine via Helm, with cost tracking</text>
<text x="32" y="160" font-size="13" fill="#5C5F78">and confirmed cleanup.</text>
<text x="32" y="177" font-size="13" fill="#22232E" font-weight="600">GPU node autoscaling 0→1→0 on one L4,</text>
<text x="32" y="194" font-size="13" fill="#22232E" font-weight="600">measured once</text>
<rect x="16" y="225" width="328" height="135" rx="4" fill="#E4E5F3" stroke="#5C5F78"/>
<rect x="16" y="225" width="4" height="135" fill="#1E5468"/>
<text x="32" y="249" font-size="14" fill="#22232E" font-weight="600">nimble-oke</text>
<text x="332" y="249" font-size="13" fill="#5C5F78" letter-spacing="1.5" text-anchor="end">SHELL</text>
<text x="32" y="273" font-size="13" fill="#5C5F78">NVIDIA NIM on Oracle Kubernetes</text>
<text x="32" y="290" font-size="13" fill="#5C5F78">Engine via Helm, with cost tracking</text>
<text x="32" y="307" font-size="13" fill="#5C5F78">and confirmed cleanup.</text>
<text x="32" y="324" font-size="13" fill="#22232E" font-weight="600">GPU node autoscaling 0→1→0 on one</text>
<text x="32" y="341" font-size="13" fill="#22232E" font-weight="600">A10, measured once</text></g>
</svg>
