<text x="32" y="328" font-size="11.5" fill="#6A625A" class="mono f d3" letter-spacing="2.5">GO · TYPESCRIPT · PYTHON · SWIFT</text>
<text x="608" y="328" font-size="11.5" fill="#6A625A" class="mono f d3" text-anchor="end" letter-spacing="0.5">v1.1 · 2026-10-02</text>
