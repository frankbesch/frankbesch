<svg viewBox="0 0 640 354" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Frank Besch, Austin, Texas. I lead, I sell, and I build.">
<style>.mono{font-family:"IBM Plex Mono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace} .sans{font-family:"Avenir Next", Inter, "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif} .f{opacity:0;animation:f .7s ease forwards} @keyframes f{to{opacity:1}} .d1{animation-delay:.15s} .d2{animation-delay:.3s} .d3{animation-delay:.45s} @media (prefers-reduced-motion: reduce){.f{animation:none;opacity:1}}</style>
<rect width="640" height="354" rx="6" fill="#FCFBF9"/>
<rect x="32" y="0" width="48" height="9" fill="#A57C2C"/>
<text x="32" y="46" font-size="11.5" fill="#6A625A" class="mono" letter-spacing="3">GITHUB — INDEX</text>
<text x="608" y="46" font-size="11.5" fill="#6A625A" class="mono" text-anchor="end" letter-spacing="3">AUSTIN, TEXAS</text>
<line x1="32" y1="60" x2="608" y2="60" stroke="#D2CCC3"/>
<text x="30" y="142" font-size="58" fill="#2B2926" class="sans f" letter-spacing="-1.2" font-weight="600">Frank Besch</text>
<text x="32" y="178" font-size="17" fill="#6A625A" class="mono f d1">I lead, I sell, and I build.</text>
<text x="32" y="226" font-size="13" fill="#6A625A" class="mono f d2" letter-spacing="1">builds  ▸</text>
