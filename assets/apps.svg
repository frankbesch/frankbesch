<rect x="16" y="225" width="4" height="118" fill="#557459"/>
<text x="32" y="249" font-size="14" fill="#22232E" font-weight="600">fibonacci-calculator</text>
<text x="332" y="249" font-size="13" fill="#5C5F78" letter-spacing="1.5" text-anchor="end">JAVASCRIPT</text>
<text x="32" y="273" font-size="13" fill="#5C5F78">Exact Fibonacci numbers at any</text>
<text x="32" y="290" font-size="13" fill="#5C5F78">position, in the browser and on the</text>
<text x="32" y="307" font-size="13" fill="#5C5F78">command line.</text>
<text x="32" y="324" font-size="13" fill="#22232E" font-weight="600">BigInt · 11 tests · live web app</text></g>
