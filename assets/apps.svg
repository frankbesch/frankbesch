<text x="32" y="102" font-size="14" fill="#22232E" font-weight="600">venture-signal</text>
<text x="332" y="102" font-size="13" fill="#5C5F78" letter-spacing="1.5" text-anchor="end">TYPESCRIPT</text>
<text x="32" y="126" font-size="13" fill="#5C5F78">Local-first decision lab for</text>
<text x="32" y="143" font-size="13" fill="#5C5F78">pressure-testing business ideas:</text>
<text x="32" y="160" font-size="13" fill="#5C5F78">attractiveness kept separate from</text>
<text x="32" y="177" font-size="13" fill="#5C5F78">evidence strength.</text>
<text x="32" y="194" font-size="13" fill="#22232E" font-weight="600">local-first · runs on your machine</text>
