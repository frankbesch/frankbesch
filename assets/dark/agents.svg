<svg viewBox="0 0 360 568" xmlns="http://www.w3.org/2000/svg" role="img" font-family='"QuoinMono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>Agents and evals</title>
<desc>Agents and evals: memvet, septdrift, and paper-forge-engine. Links and receipts follow in text.</desc>
<style>@font-face{font-family:"QuoinMono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinMono";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="360" height="568" rx="6" fill="#0E1C2B"/>
<text x="16" y="36" font-size="26" fill="#A8A296">03</text>
<text x="58" y="32" font-size="13" fill="#E8E2D6" letter-spacing="1.5">AGENTS AND EVALS</text>
<text x="344" y="32" font-size="13" fill="#A8A296" text-anchor="end">~/03-agents</text>
<line x1="16" y1="50" x2="344" y2="50" stroke="#2D4152"/>
<rect x="16" y="78" width="328" height="135" rx="4" fill="#19293B" stroke="#A8A296"/>
<rect x="16" y="78" width="4" height="135" fill="#D3AA55"/>
<text x="32" y="102" font-size="14" fill="#E8E2D6" font-weight="600">memvet</text>
<text x="332" y="102" font-size="13" fill="#A8A296" letter-spacing="1.5" text-anchor="end">GO</text>
<text x="32" y="126" font-size="13" fill="#A8A296">go vet for file-based AI agent state:</text>
<text x="32" y="143" font-size="13" fill="#A8A296">integrity checks for memory,</text>
<text x="32" y="160" font-size="13" fill="#A8A296">instructions, decisions, and</text>
<text x="32" y="177" font-size="13" fill="#A8A296">contracts.</text>
<text x="32" y="194" font-size="13" fill="#E8E2D6" font-weight="600">v0.12.0 · read-only check · MIT</text>
<rect x="16" y="246" width="328" height="135" rx="4" fill="#19293B" stroke="#A8A296"/>
<rect x="16" y="246" width="4" height="135" fill="#D3AA55"/>
<text x="32" y="270" font-size="14" fill="#E8E2D6" font-weight="600">septdrift</text>
<text x="332" y="270" font-size="13" fill="#A8A296" letter-spacing="1.5" text-anchor="end">SWIFT</text>
<text x="32" y="294" font-size="13" fill="#A8A296">Catches drift in Apple Foundation</text>
<text x="32" y="311" font-size="13" fill="#A8A296">Models behavior across macOS updates,</text>
<text x="32" y="328" font-size="13" fill="#A8A296">scored check by check from</text>
<text x="32" y="345" font-size="13" fill="#A8A296">hash-chained recordings.</text>
<text x="32" y="362" font-size="13" fill="#E8E2D6" font-weight="600">136 tests · measured once on two Macs</text>
<rect x="16" y="414" width="328" height="135" rx="4" fill="#19293B" stroke="#A8A296"/>
<rect x="16" y="414" width="4" height="135" fill="#D3AA55"/>
<text x="32" y="438" font-size="14" fill="#E8E2D6" font-weight="600">paper-forge-engine</text>
<text x="332" y="438" font-size="13" fill="#A8A296" letter-spacing="1.5" text-anchor="end">PYTHON</text>
<text x="32" y="462" font-size="13" fill="#A8A296">Local research library: capture with</text>
<text x="32" y="479" font-size="13" fill="#A8A296">checksums, seven-stage workbooks,</text>
<text x="32" y="496" font-size="13" fill="#A8A296">assessments, and an offline console.</text>
<text x="32" y="513" font-size="13" fill="#E8E2D6" font-weight="600">standard library only ·</text>
<text x="32" y="530" font-size="13" fill="#E8E2D6" font-weight="600">byte-identical output</text>
</svg>
