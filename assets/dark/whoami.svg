<svg viewBox="0 0 360 412" xmlns="http://www.w3.org/2000/svg" role="img" font-family='"QuoinMono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>Who I am</title>
<desc>Who I am: Customers should see evidence before they commit. I lead teams and build the tools that produce it. Recent work: multi-agent systems with persistent memory, LLM evaluation and drift-testing harnesses, and governed demo pipelines, in Go, Python, and Swift, plus NVIDIA NIM on Kubernetes. I define value with the customer first. Paired evals and cost models then show where model judgment ends and deterministic code takes over. The customer decides whether the evidence supports committing.</desc>
<style>@font-face{font-family:"QuoinMono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}</style>
