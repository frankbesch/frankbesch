<svg viewBox="0 0 360 568" xmlns="http://www.w3.org/2000/svg" role="img" font-family='"QuoinMono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>System map</title>
<desc>System map in three groups. Agents and evals: memvet (installed by homebrew-tap), septdrift, paper-forge-engine; gpu inference: nim-gke, nimble-oke; apps and decisions: venture-signal, fibonacci-calculator. nim-gke and nimble-oke are the same NVIDIA NIM kit on two clouds.</desc>
