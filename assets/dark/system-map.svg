<text x="28" y="169" font-size="14" fill="#E8E2D6" font-weight="600">homebrew-tap</text>
<text x="28" y="187" font-size="13" fill="#A8A296">brew install frankbesch/tap/memvet</text>
<rect x="16" y="200" width="328" height="40" rx="4" fill="#19293B" stroke="#A8A296"/>
<text x="28" y="215" font-size="14" fill="#E8E2D6" font-weight="600">septdrift</text>
